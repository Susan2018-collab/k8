---
- name: Enterprise Daily Vulnerability Scan
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    scan_mode: "daily"
    email_to: "susan.joffin@gmail.com"

  tasks:

    # =========================
    # ENV FILTER
    # =========================
    - name: Skip based on environment
      meta: end_host
      when: env is defined and env != "all" and inventory_hostname not in groups[env]

    # =========================
    # FACT SAFETY (MODERN STYLE)
    # =========================
    - name: Set OS family fact
      set_fact:
        os_family: "{{ ansible_facts['os_family'] }}"

    # =========================
    # DEBIAN / UBUNTU SCAN
    # =========================
    - name: Update package metadata (Debian)
      apt:
        update_cache: yes
      when: os_family == "Debian"

    - name: List upgradable packages (Debian)
      shell: apt list --upgradable
      register: debian_scan
      changed_when: false
      ignore_errors: yes
      when: os_family == "Debian"

    # =========================
    # RHEL / CENTOS SCAN
    # =========================
    - name: RHEL security scan (safe execution)
      shell: |
        if command -v dnf >/dev/null 2>&1; then
          dnf updateinfo list security
        elif command -v yum >/dev/null 2>&1; then
          yum updateinfo list security
        else
          echo "No RHEL package manager found"
        fi
      register: rhel_scan
      changed_when: false
      ignore_errors: yes
      when: os_family == "RedHat"

    # =========================
    # REPORT GENERATION
    # =========================
    - name: Generate scan report
      copy:
        dest: "/tmp/scan_{{ inventory_hostname }}.txt"
        content: |
          ============================
          ENTERPRISE SECURITY SCAN
          ============================
          Host: {{ inventory_hostname }}
          OS Family: {{ os_family }}
          OS: {{ ansible_facts['distribution'] }}
          Environment: {{ env | default('all') }}
          Scan Mode: {{ scan_mode }}

          -------- DEBIAN UPGRADES --------
          {{ debian_scan.stdout | default('Not applicable') }}

          -------- RHEL SECURITY --------
          {{ rhel_scan.stdout | default('Not applicable') }}

    # =========================
    # READ REPORT
    # =========================
    - name: Read report
      slurp:
        src: "/tmp/scan_{{ inventory_hostname }}.txt"
      register: report_file

    - name: Store report
      set_fact:
        report: "{{ report_file.content | b64decode }}"

    # =========================
    # EMAIL NOTIFICATION
    # =========================
    - name: Send email report
      delegate_to: localhost
      shell: |
        echo "{{ report }}" | mail -s "DAILY SECURITY SCAN - {{ inventory_hostname }} ({{ env | default('all') }})" {{ email_to }}
