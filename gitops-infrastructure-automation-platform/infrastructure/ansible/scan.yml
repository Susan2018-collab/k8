---
- name: Enterprise Daily Vulnerability Scan
  hosts: all
  become: no
  gather_facts: yes

  vars:
    scan_mode: "daily"

  tasks:

    # =========================
    # ENV FILTER
    # =========================
    - name: Skip based on environment
      meta: end_host
      when: env is defined and env != "all" and inventory_hostname not in groups[env]

    # =========================
    # OS DETECTION
    # =========================
    - name: Set OS family
      set_fact:
        os_family: "{{ ansible_facts['os_family'] }}"

    # =========================
    # SAFE DEBIAN SCAN (NO LOCKS)
    # =========================
    - name: Check Debian security updates (safe mode)
      shell: apt-get -s upgrade
      register: debian_scan
      changed_when: false
      failed_when: false
      when: os_family == "Debian"

    # =========================
    # SAFE RHEL SCAN
    # =========================
    - name: Check RHEL security updates
      shell: |
        if command -v dnf >/dev/null 2>&1; then
          dnf updateinfo list security || true
        elif command -v yum >/dev/null 2>&1; then
          yum updateinfo list security || true
        else
          echo "No RHEL tools found"
        fi
      register: rhel_scan
      changed_when: false
      failed_when: false
      when: os_family == "RedHat"

    # =========================
    # REPORT GENERATION
    # =========================
    - name: Generate scan report
      copy:
        dest: "/tmp/scan_{{ inventory_hostname }}.txt"
        content: |
          ============================
          ENTERPRISE SECURITY SCAN
          ============================
          Host: {{ inventory_hostname }}
          OS: {{ ansible_facts['distribution'] }}
          Family: {{ os_family }}
          Env: {{ env | default('all') }}
          Scan: {{ scan_mode }}

          -------- DEBIAN --------
          {{ debian_scan.stdout | default('Not applicable') }}

          -------- RHEL --------
          {{ rhel_scan.stdout | default('Not applicable') }}

    # =========================
    # READ REPORT
    # =========================
    - name: Read report
      slurp:
        src: "/tmp/scan_{{ inventory_hostname }}.txt"
      register: report_file

    - name: Store report
      set_fact:
        report: "{{ report_file.content | b64decode }}"
