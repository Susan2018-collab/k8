- name: Enterprise Daily Vulnerability Scan
  hosts: all
  gather_facts: no

  tasks:

    # =========================
    # ENV FILTER
    # =========================
    - name: Skip based on environment
      meta: end_host
      when: env is defined and env != "all" and inventory_hostname not in groups[env]

    # =========================
    # DEBIAN SCAN
    # =========================
    - name: Update package metadata (Debian/Ubuntu)
      delegate_to: localhost
      shell: docker exec {{ inventory_hostname }} apt-get update
      ignore_errors: yes

    - name: List upgradable packages (Debian)
      delegate_to: localhost
      shell: docker exec {{ inventory_hostname }} apt list --upgradable
      register: debian_scan
      ignore_errors: yes

    # =========================
    # RHEL SCAN
    # =========================
    - name: RHEL security scan
      delegate_to: localhost
      shell: docker exec {{ inventory_hostname }} bash -c "dnf updateinfo list security || yum updateinfo list security"
      register: rhel_scan
      ignore_errors: yes

    # =========================
    # CREATE REPORT
    # =========================
    - name: Create scan report file
      delegate_to: localhost
      copy:
        dest: "/tmp/scan_{{ inventory_hostname }}.txt"
        content: |
          ==============================
          Host: {{ inventory_hostname }}
          Environment: {{ env | default('unknown') }}
          ==============================

          -------- DEBIAN UPDATES --------
          {{ debian_scan.stdout | default('No Debian updates found') }}

          -------- RHEL SECURITY UPDATES --------
          {{ rhel_scan.stdout | default('No RHEL updates found') }}

    # =========================
    # READ REPORT
    # =========================
    - name: Load final report
      delegate_to: localhost
      shell: cat /tmp/scan_{{ inventory_hostname }}.txt
      register: report_output

    - name: Store report
      set_fact:
        report: "{{ report_output.stdout }}"

    # =========================
    # EMAIL NOTIFICATION (FIXED)
    # =========================
    - name: Send email report
      delegate_to: localhost
      shell: |
        echo "{{ report }}" | mail -s "DAILY SECURITY SCAN - {{ inventory_hostname }} ({{ env | default('all') }})" {{ email_to }}
