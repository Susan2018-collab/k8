---
- name: Patch + Validate Mail Server
  hosts: all
  become: yes

  vars:
    service_name: exim4
    smtp_port: 25
    test_mail_to: susan.joffin@gmail.com

  tasks:

  # =========================
  # PRE CHECK
  # =========================
  - name: Check Exim status before patch
    shell: systemctl is-active {{ service_name }} || true
    register: exim_pre

  - name: Check SMTP port before patch
    shell: nc -zv 127.0.0.1 {{ smtp_port }} >/dev/null 2>&1 && echo OPEN || echo CLOSED
    register: smtp_pre

  # =========================
  # PATCHING
  # =========================
  - name: Update packages
    apt:
      update_cache: yes
      upgrade: dist
    register: patch_result

  # =========================
  # REBOOT IF REQUIRED
  # =========================
  - name: Check if reboot required
    stat:
      path: /var/run/reboot-required
    register: reboot_flag

  - name: Reboot system if required
    reboot:
      reboot_timeout: 600
    when: reboot_flag.stat.exists

  # =========================
  # WAIT FOR SYSTEM
  # =========================
  - name: Wait for SSH
    wait_for:
      port: 22
      delay: 10
      timeout: 300

  # =========================
  # WAIT FOR EXIM SERVICE
  # =========================
  - name: Wait for Exim to start
    shell: systemctl is-active {{ service_name }}
    register: exim_wait
    retries: 10
    delay: 10
    until: exim_wait.stdout == "active"

  - name: Check SMTP port after patch
    shell: nc -zv 127.0.0.1 {{ smtp_port }} >/dev/null 2>&1 && echo OPEN || echo CLOSED
    register: smtp_post

  # =========================
  # SEND TEST MAIL
  # =========================
  - name: Send test mail
    shell: |
      echo "Patch successful at $(date)" | mail -s "Patch Test Mail" {{ test_mail_to }}
    register: mail_send

  - name: Wait for mail log
    pause:
      seconds: 5

  - name: Get latest mail log
    shell: tail -n 5 /var/log/exim4/mainlog
    register: mail_log

  # =========================
  # FINAL STATUS
  # =========================
  - name: Set final status
    set_fact:
      final_status: >-
        {% if exim_wait.stdout == "active" and smtp_post.stdout == "OPEN" %}
        SUCCESS
        {% else %}
        FAILED
        {% endif %}

  # =========================
  # REPORT OUTPUT (IMPORTANT)
  # =========================
  - name: Display patch report
    debug:
      msg: |
        =====================================
        PATCH REPORT
        Host: {{ inventory_hostname }}

        PRE-CHECK:
        Exim Status Before Patch: {{ exim_pre.stdout }}
        SMTP Before: {{ smtp_pre.stdout }}

        PATCH:
        Packages Updated: {{ patch_result.changed }}

        POST-CHECK:
        Exim Running: {{ exim_wait.stdout }}
        SMTP Port: {{ smtp_post.stdout }}

        MAIL TEST:
        Mail Sent: {{ mail_send.rc == 0 }}

        MAIL LOGS:
        {{ mail_log.stdout }}

        STATUS:
        {{ final_status }}
        =====================================

  # =========================
  # FAIL IF BROKEN
  # =========================
  - name: Fail if validation failed
    fail:
      msg: "Service failed after patch"
    when: final_status != "SUCCESS"
